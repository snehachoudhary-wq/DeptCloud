{% extends 'base.html' %}{% block content %}<h2>User Management</h2><p class="text-muted">Assign faculty roles only to verified department members.</p><div class="table-responsive"><table class="table table-striped"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Action</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.full_name}}</td><td>{{u.email}}</td><td>{{u.role}}</td><td>{% if u.id!=me.id %}<form method="post" class="d-flex gap-2" action="{{url_for('set_role',user_id=u.id)}}"><select class="form-select form-select-sm" name="role">{% for role in ['student','faculty','admin'] %}<option value="{{role}}" {% if role==u.role %}selected{% endif %}>{{role}}</option>{% endfor %}</select><button class="btn btn-sm btn-primary">Save</button></form>{% else %}Current user{% endif %}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
