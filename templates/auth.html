{% extends 'base.html' %}{% block content %}<div class="card shadow-sm mx-auto" style="max-width:450px"><div class="card-body p-4"><h2>{{'Create Account' if mode=='register' else 'Sign In'}}</h2><form method="post">{% if mode=='register' %}<label class="form-label mt-3">Full name</label><input name="full_name" class="form-control" required>{% endif %}<label class="form-label mt-3">Email</label><input type="email" name="email" class="form-control" required><label class="form-label mt-3">Password</label><input type="password" name="password" class="form-control" minlength="6" required><button class="btn btn-primary w-100 mt-4">{{'Register' if mode=='register' else 'Login'}}</button></form><p class="mt-3 mb-0">{% if mode=='register' %}<a href="{{url_for('login')}}">Already registered? Sign in</a>{% else %}<a href="{{url_for('register')}}">Create a student account</a>{% endif %}</p></div></div>{% endblock %}
