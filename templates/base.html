<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeptCloud</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><nav class="navbar navbar-expand-lg navbar-dark bg-primary"><div class="container"><a class="navbar-brand fw-bold" href="{{url_for('index')}}">☁ DeptCloud</a><div class="d-flex gap-2 align-items-center">{% if me %}<span class="text-white small">{{me.full_name}} ({{me.role}})</span><a class="btn btn-sm btn-outline-light" href="{{url_for('index')}}">Files</a>{% if me.role in ['faculty','admin'] %}<a class="btn btn-sm btn-outline-light" href="{{url_for('upload')}}">Upload</a>{% endif %}{% if me.role=='admin' %}<a class="btn btn-sm btn-outline-light" href="{{url_for('admin')}}">Admin</a>{% endif %}<form action="{{url_for('logout')}}" method="post"><button class="btn btn-sm btn-light">Logout</button></form>{% endif %}</div></div></nav><main class="container py-4">{% for category,msg in get_flashed_messages(with_categories=true) %}<div class="alert alert-{{category}}">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
