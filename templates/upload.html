{% extends 'base.html' %}{% block content %}<h2>Upload to Cloud Storage</h2><div class="card p-4" style="max-width:650px"><form method="post" enctype="multipart/form-data">{% for key,label in [('title','Document title'),('subject','Subject'),('semester','Semester'),('department','Department')] %}<label class="form-label">{{label}}</label><input class="form-control mb-3" name="{{key}}" required>{% endfor %}<label class="form-label">File (PDF, DOCX, PPTX, TXT, XLSX; max 10 MB)</label><input type="file" class="form-control mb-3" name="file" accept=".pdf,.docx,.pptx,.txt,.xlsx" required><button class="btn btn-primary">Upload File</button></form></div>{% endblock %}
